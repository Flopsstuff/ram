# proxy: the one way into the stack. cloudflared hands every request for the
# public hostname to this nginx, and the path decides where it goes:
#
#   /wiki/...    SilverBullet (SB_URL_PREFIX=/wiki), behind the Authelia login
#   /sso/...     Authelia: the login portal and the OIDC provider
#   /            exactly the root: a redirect to the wiki
#   the rest     the MCP server: /mcp, its OAuth endpoints, /.well-known/...
#
# The MCP server keeps the root because MCP clients look for the OAuth
# metadata at the root of the host. A new app gets its own prefix here.
#
# No hostname in this file: it answers for whatever host the tunnel sends, and
# the real name lives only in .env and authelia/configuration.yml.
#
# TLS ends at Cloudflare's edge, so this hop is plain HTTP; every backend is
# told the public scheme through X-Forwarded-Proto.
#
# Mounted as /etc/nginx/conf.d/default.conf, so everything here is inside
# nginx's `http` block.

server {
    listen 80 default_server;
    server_name _;

    # Docker's DNS, asked at request time. With the names written straight
    # into proxy_pass nginx resolves them once at start: it would refuse to
    # start while a backend is still coming up, and keep a dead address after
    # a backend is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mcp      http://markdown-vault-mcp:8000;
    set $authelia http://authelia:9091;
    set $wiki     http://wiki:3000;

    # Redirects are sent as paths: an absolute one would carry `http://`.
    absolute_redirect off;

    # Request bodies: the MCP endpoint itself refuses more than 4 MiB, so 8m
    # is room enough everywhere; only the upload links take more (below). The
    # cap matters for /register, which is public and has no limit of its own.
    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Connection        "";

    # --- People land on the wiki ---
    location = / {
        return 302 /wiki/;
    }

    # --- Authelia: login portal + OIDC provider, under its own prefix ---
    # (server.address in authelia/configuration.yml carries the same /sso.)
    location = /sso {
        return 302 /sso/;
    }
    location /sso/ {
        proxy_pass $authelia;
    }

    # --- The wiki ---
    location = /wiki {
        return 302 /wiki/;
    }

    # Public, no login: static files only, nothing from the vault.
    # - Our favicon set (wiki/icons), at the paths SilverBullet's page and web
    #   manifest point to, in place of SilverBullet's own.
    location ~ ^/wiki/\.client/(favicon\.svg|favicon-96x96\.png|favicon\.ico|apple-touch-icon\.png|logo-dock\.png)$ {
        alias /srv/icons/$1;
    }
    # - SilverBullet's service worker script. Browsers refuse to register a
    #   service worker whose script answers with a redirect, and the
    #   registration request reaches Authelia without a usable session, so it
    #   would get the login redirect and SilverBullet would lose its offline
    #   cache. The script is SilverBullet's own client code; every request it
    #   makes for notes still goes through the login below. Its scope is
    #   /wiki/, so it never sees a request for /mcp or /sso.
    location = /wiki/service_worker.js {
        proxy_pass $wiki;
    }

    # Everything else of the wiki: Authelia first, then SilverBullet.
    location /wiki/ {
        auth_request /internal/authz;
        # Not logged in: Authelia answers 401 with the portal's address (and
        # the page to come back to) in Location.
        auth_request_set $login_url $upstream_http_location;
        error_page 401 =302 $login_url;

        auth_request_set $user   $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $email  $upstream_http_remote_email;
        auth_request_set $name   $upstream_http_remote_name;
        proxy_set_header Remote-User   $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Email  $email;
        proxy_set_header Remote-Name   $name;
        # A proxy_set_header here replaces the whole set inherited from the
        # server block, so that set is repeated.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";

        proxy_pass $wiki;
    }

    # The question to Authelia behind every wiki request: is this session
    # allowed to see this URL? Only nginx itself can call it. Authelia answers
    # at the root as well as under /sso, so this inner call needs no prefix.
    location = /internal/authz {
        internal;
        proxy_pass $authelia/api/authz/auth-request;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Connection        "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL    https://$http_host$request_uri;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # --- The MCP server: everything that is not claimed above ---
    # Its answers are streams (streamable HTTP, SSE): buffered, they would
    # reach the client late or never; and an open stream may stay silent far
    # longer than nginx's default 60 s.
    location / {
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        # The server builds its few redirects to itself (a trailing slash,
        # /mcp/ → /mcp) from the scheme it was called with, which here is
        # http. Sent on as a path, such a redirect keeps the browser's own
        # scheme. Only redirects to this very host are touched: the OAuth
        # flow ends in a redirect to the client's own address, often
        # http://127.0.0.1:<port>/…, and that one must arrive as it is.
        proxy_redirect http://$http_host/ /;
        proxy_pass $mcp;
    }

    # Upload and download links of the MCP server (create_upload_link /
    # create_download_link): the token in the path is the credential. The
    # server takes up to 100 MiB here (TRANSFER_MAX_UPLOAD_BYTES); so does
    # Cloudflare.
    location /transfer/ {
        client_max_body_size    100m;
        proxy_request_buffering off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        proxy_pass $mcp;
    }
}
