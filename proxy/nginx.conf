# proxy: the one way in behind cloudflared. The path decides the backend:
#   /wiki/   SilverBullet (SB_URL_PREFIX=/wiki), behind the Authelia login
#   /sso/    Authelia (login portal + OIDC provider)
#   /        exactly the root: redirect to the wiki
#   the rest the MCP server (/mcp, its OAuth endpoints, /.well-known/...)
# The MCP server keeps the root: MCP clients look for the OAuth metadata there.
# No hostname here; it answers for whatever host the tunnel sends.
# Included into nginx's http{} block as conf.d/default.conf.

# Access log without the query string, so an OAuth code stays out of it.
log_format sanitized '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

server {
    listen 80 default_server;
    server_name _;

    # Resolve backends at request time, so nginx starts before them and
    # survives their recreation (names must be variables for this to apply).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mcp      http://markdown-vault-mcp:8000;
    set $authelia http://authelia:9091;
    set $wiki     http://wiki:3000;

    absolute_redirect off;
    access_log /var/log/nginx/access.log sanitized;

    # Refuse a `..` segment in any encoding. nginx matches the location on the
    # normalised path but proxies the raw one, so a `..` that climbs out of a
    # prefix can borrow a safer location's rules. A lone `%2F` is left alone:
    # SilverBullet uses it in /.revisions/ paths.
    if ($request_uri ~* "(^|/|%2f|%5c|\?)(\.|%2e)(\.|%2e)($|/|%2f|%5c|\?)") {
        return 400;
    }

    # 8m everywhere (the MCP endpoint caps itself at 4 MiB); /wiki/ and
    # /transfer/ raise it below.
    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto https;   # TLS ends at Cloudflare
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Connection        "";

    location = / {
        return 302 /wiki/;
    }

    location = /sso {
        return 302 /sso/;
    }
    location /sso/ {
        proxy_pass $authelia;
    }

    location = /wiki {
        return 302 /wiki/;
    }

    # Public, no login, nothing from the vault: our favicons (in place of
    # SilverBullet's), and the service worker script (a browser refuses to
    # register one that answers with a redirect). The upstream path is written
    # out so only this file is served, however the request was spelled.
    location ~ ^/wiki/\.client/(favicon\.svg|favicon-96x96\.png|favicon\.ico|apple-touch-icon\.png|logo-dock\.png)$ {
        alias /srv/icons/$1;
    }
    location = /wiki/service_worker.js {
        proxy_pass $wiki/wiki/service_worker.js;
    }

    # Closed for everyone: /.shell runs a command in the wiki container (also
    # off via SB_SHELL_BACKEND), /.proxy fetches any URL (SSRF into the network).
    location ^~ /wiki/.shell {
        return 403;
    }
    location ^~ /wiki/.proxy {
        return 403;
    }

    location /wiki/ {
        client_max_body_size 100m;   # attachment uploads

        auth_request /internal/authz;
        auth_request_set $login_url $upstream_http_location;
        error_page 401 =302 $login_url;

        auth_request_set $user   $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $email  $upstream_http_remote_email;
        auth_request_set $name   $upstream_http_remote_name;
        # A proxy_set_header here drops the set inherited from the server block,
        # so it is repeated.
        proxy_set_header Remote-User   $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Email  $email;
        proxy_set_header Remote-Name   $name;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";

        proxy_pass $wiki;
    }

    # The per-request login check; only nginx calls it.
    location = /internal/authz {
        internal;
        # The subrequest is checked against the caller's Content-Length; the
        # caller's own location already enforces its cap.
        client_max_body_size 0;
        proxy_pass $authelia/api/authz/auth-request;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Connection        "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL    https://$http_host$request_uri;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # The MCP server: everything else. Its answers stream, so no buffering and
    # a long timeout; its self-redirects come back as http on this hop, so send
    # them on as paths — but only for this host, or the OAuth redirect to the
    # client's own http://127.0.0.1 address would be broken too.
    location / {
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        proxy_redirect http://$http_host/ /;
        proxy_pass $mcp;
    }

    # MCP upload/download links (create_upload_link/_download_link): token in
    # the path, so keep it out of the log; up to 100 MiB, as on Cloudflare.
    location /transfer/ {
        access_log off;
        client_max_body_size    100m;
        proxy_request_buffering off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        proxy_pass $mcp;
    }
}
