# ram — Random Agents Memories
# Central shared-brain MCP server + Cloudflare Tunnel ingress.
# See the "Design rationale" section of README.md for the full rationale.
#
#   markdown-vault-mcp : the MCP server (managed git, FastEmbed, HTTP transport)
#   cloudflared        : Cloudflare Tunnel (Method B, locally-managed config)
#   authelia           : OIDC provider for MCP OAuth + forward-auth for the wiki
#   wiki, wiki-sync,
#   wiki-proxy         : SilverBullet in the browser on its own vault clone
#
# No container publishes ports to the host. The ONLY ingress is via cloudflared.

name: ram-brain

services:
  markdown-vault-mcp:
    image: ghcr.io/pvliesdonk/markdown-vault-mcp:latest
    restart: unless-stopped
    # FastEmbed/onnxruntime sizes its thread pool to the core count, so the
    # boot-time reindex pins ALL cores (~800% on the 8-core host) for as long as
    # it takes to re-embed whatever changed since the last boot — right when the
    # other 30+ containers on that host are starting too. Capped at 2 cores, with
    # a low share so it yields under contention. The embed job is background:
    # the server accepts requests ~6s after start regardless, so a slower
    # catch-up costs nothing visible.
    cpus: "2.0"
    cpu_shares: 256
    # Named volumes arrive root-owned, and the image's own entrypoint fixes only
    # /data, never /vault — so a fresh vault-data volume would make the managed
    # `git clone` die with "Permission denied". This wrapper runs FIRST, as root
    # (the image sets no USER; it drops to appuser itself via gosu at the end of
    # docker-entrypoint.sh), chowns /vault only when it is still root-owned, then
    # hands over to the stock entrypoint unchanged. Used to be a separate
    # one-shot `init-perms` service, which left an Exited container lying around
    # in every container list. UID/GID mirror the entrypoint's own PUID/PGID
    # defaults, so `user:`-less installs stay consistent.
    entrypoint:
      - sh
      - -c
      - |
        if [ "$$(stat -c %u /vault)" = 0 ]; then
          chown -R "$${PUID:-1000}:$${PGID:-1000}" /vault
        fi
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - --
    # MCP instructions come from the server's own generated guidance plus two env
    # vars in .env: MARKDOWN_VAULT_MCP_INSTANCE_DESCRIPTION and _INSTRUCTIONS_EXTRA.
    # Vault-specific rules live in the vault's _conventions.md files, not in this
    # public repo.
    command: ["markdown-vault-mcp", "serve", "--transport", "http", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      PYTHONPATH: /etc/ram/patches   # loads patches/sitecustomize.py (see the mount below)
    volumes:
      - vault-data:/vault                              # git-managed vault clone (persistent)
      - app-data:/data                                 # FTS index + embeddings + session state (NOT in git)
      # Startup patch (patches/sitecustomize.py, imported by Python at start via
      # PYTHONPATH): fills the `index` Gemini's OpenAI-compat endpoint omits on
      # the first embedding, without which batch indexing dies with TypeError.
      # Remove both lines once the upstream fix ships.
      - ./patches:/etc/ram/patches:ro
    networks:
      - brain
    # NOTE: intentionally no `ports:` — reachable only through cloudflared.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Three public hostnames share this one tunnel, so a single TUNNEL_URL
    # origin no longer suffices — routing is done by ingress rules in
    # ./cloudflared/config.yml (ram.* → mcp, auth.* → authelia,
    # wiki.* → wiki-proxy). Credentials
    # still come from the environment; only ingress moved into a file.
    #   CF_TUNNEL_ID          which tunnel to run (.env), passed to `run <ID>`
    #   TUNNEL_CRED_CONTENTS  tunnel credentials JSON, inline (.env)
    #   config.yml            per-hostname ingress (mounted; gitignored real file)
    # The public hostnames live in Cloudflare DNS + config.yml, not in compose.
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run ${CF_TUNNEL_ID:?set CF_TUNNEL_ID in .env}
    environment:
      TUNNEL_CRED_CONTENTS: ${TUNNEL_CRED_CONTENTS:?set TUNNEL_CRED_CONTENTS in .env}
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      - markdown-vault-mcp
      - authelia
      - wiki-proxy
    networks:
      - brain

  # OIDC identity provider for the OAuth (oidc-proxy) login path. Reachable only
  # through cloudflared at <AUTH_DOMAIN> — no `ports:`. Config is mounted
  # read-only; all mutable state (SQLite + notifications) is on the authelia-data
  # named volume so the CD runner's `git clean` can't wipe it.
  authelia:
    image: authelia/authelia:latest
    restart: unless-stopped
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users_database.yml:/config/users_database.yml:ro
      - authelia-data:/var/lib/authelia
    networks:
      - brain
    # NOTE: intentionally no `ports:` — reachable only through cloudflared.

  # --- Wiki: browse and edit the vault in a browser at <WIKI_DOMAIN> ---
  # cloudflared → wiki-proxy (Authelia forward-auth) → wiki (SilverBullet).
  # The wiki works on its OWN clone of the vault (wiki-data), never on the MCP
  # server's /vault: a second writer in that working tree would block the
  # server's rebase and bypass its index. wiki-sync commits browser edits and
  # pushes them to the vault repo; the MCP server picks them up on its next
  # pull and reindexes them itself.

  # Git side of the wiki: clones the vault into wiki-data on first start, then
  # commits + pushes edits and pulls agents' changes, on the MCP server's own
  # GIT_PUSH_DELAY_S / GIT_PULL_INTERVAL_S (see wiki/sync.sh).
  wiki-sync:
    image: alpine/git:latest
    restart: unless-stopped
    entrypoint: ["sh", "/etc/wiki/sync.sh"]
    env_file:
      - .env
    volumes:
      - wiki-data:/data
      - ./wiki/sync.sh:/etc/wiki/sync.sh:ro
      - ./wiki/space:/etc/wiki/space:ro   # wiki settings + style, copied in on start
    # SilverBullet must not start on an empty folder (it would set up a fresh
    # space there and the clone would refuse the non-empty directory).
    healthcheck:
      test: ["CMD", "test", "-d", "/data/.git"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks:
      - brain

  # SilverBullet: the browser editor. No auth of its own: it is reachable only
  # through wiki-proxy, which lets in nobody without an Authelia session.
  wiki:
    # Pinned: 3.0 is on the way and moves CONFIG.md to Library/Config.md and
    # runs space-lua only from Library/. Bump deliberately, after checking
    # wiki/space/ still applies.
    image: ghcr.io/silverbulletmd/silverbullet:2.12.1-slim
    restart: unless-stopped
    environment:
      SB_INDEX_PAGE: README     # the vault has no index.md; open its README
      SB_NAME: ram wiki         # app name in the web manifest (installed PWA)
    volumes:
      - wiki-data:/data
    depends_on:
      wiki-sync:
        condition: service_healthy
    networks:
      - brain
    # NOTE: intentionally no `ports:` — reachable only through wiki-proxy.

  # Caddy in front of the wiki: asks Authelia about every request
  # (forward-auth) and proxies the allowed ones to SilverBullet. See
  # wiki/Caddyfile.
  wiki-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./wiki/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./wiki/icons:/srv/icons:ro          # our favicon set, served instead of SilverBullet's
    depends_on:
      - wiki
      - authelia
    networks:
      - brain
    # NOTE: intentionally no `ports:` — reachable only through cloudflared.

networks:
  brain:
    driver: bridge

volumes:
  vault-data:
  app-data:
  authelia-data:   # Authelia SQLite + notifications (must persist across CD git clean)
  wiki-data:       # the wiki's own clone of the vault (SilverBullet + wiki-sync)
